[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-imposing"
version = "0.4.0"
description = "Vector-preserving PDF imposition with template and project files"
requires-python = ">=3.12"
dependencies = ["pikepdf==10.18.0", "Pillow==13.0.0", "fonttools==4.68.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
gui = ["PySide6-Essentials==6.10.1"]

[project.scripts]
quick-imposing = "imposing.__main__:main"

[project.gui-scripts]
quick-imposing-work = "imposing.gui.work:main"
quick-imposing-editor = "imposing.gui.editor:main"

[tool.setuptools.packages.find]
include = ["imposing*"]

[tool.setuptools.package-data]
"imposing.gui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
