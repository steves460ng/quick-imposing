name: windows

# Windows 검증(테스트)과 배포 폴더 빌드. 수동 실행하거나 작업 브랜치에 push하면 돈다.
on:
  workflow_dispatch:
  push:
    branches: ["ccr-**", "release/**"]
    paths: ["imposing/**", "tests/**", "packaging/**", "*.py", "pyproject.toml", ".github/workflows/windows.yml"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: qpdf, Poppler 내려받기
        shell: pwsh
        run: |
          ./packaging/build.ps1 -ToolsOnly
          "$PWD\bin\qpdf", "$PWD\bin\poppler" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 테스트용 글꼴 (Noto Sans CJK KR)
        shell: pwsh
        run: |
          $fonts = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force $fonts | Out-Null
          Invoke-WebRequest "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf" -OutFile "$fonts\NotoSansCJKkr-Regular.otf"

      - name: 설치
        run: python -m pip install -e ".[test,gui]" pyinstaller

      - name: 도구 버전
        shell: pwsh
        run: |
          python --version
          qpdf --version
          pdftoppm -v

      - name: pytest
        shell: pwsh
        run: |
          # 임시 폴더를 저장소와 같은 드라이브에 둔다(B는 프로젝트 기준 상대경로).
          New-Item -ItemType Directory -Force out | Out-Null
          python -m pytest -q --tb=short --basetemp=out/pytest-tmp

      - name: 3-1차·3-2차 실행기
        if: always()
        shell: pwsh
        run: |
          python test03_runner.py --out out/ci-test03-1 > out-test03-1.log
          $a = $LASTEXITCODE
          python test32_runner.py --out out/ci-test03-2 > out-test03-2.log
          $b = $LASTEXITCODE
          python -c "import json; [print(n, {k: s[k] for k in ('status', 'passed', 'case_count') if k in s}, [(c['case'], [f['id'] if isinstance(f, dict) else str(f)[:200] for f in c['failures']]) for c in s.get('cases', []) if c['status'] != 'PASS']) for n in ('ci-test03-1', 'ci-test03-2') for s in [json.load(open(f'out/{n}/summary.json', encoding='utf-8'))]]"
          if ($a -ne 0 -or $b -ne 0) { exit 1 }

      - name: Windows 기본 글꼴(맑은 고딕)과 한글 경로
        if: always()
        shell: pwsh
        run: |
          $work = "out\한글 폴더"
          New-Item -ItemType Directory -Force $work | Out-Null
          (Get-Content samples\manual\T31-front-3x8.json -Raw -Encoding utf8).Replace("Noto Sans CJK KR", "Malgun Gothic") | Set-Content "$work\malgun.json" -Encoding utf8
          python -m imposing create-template "$work\malgun.json" --base samples\input\base-front-blank.pdf --templates-root "$work\템플릿"
          python -m imposing build samples\test03-1\projects\T31-01.qiproj.json --templates-root "$work\템플릿" --output "$work\결과-01.pdf"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$work\결과-01.pdf" out\malgun-check.pdf
          pdffonts out\malgun-check.pdf
          Get-ChildItem $work | ForEach-Object { $_.Name }

      - name: GUI 시작 점검 (소스 실행)
        if: always()
        shell: pwsh
        run: |
          python -m imposing.gui.work --selftest
          "work: $LASTEXITCODE"; $a = $LASTEXITCODE
          python -m imposing.gui.editor --selftest
          "editor: $LASTEXITCODE"; $b = $LASTEXITCODE
          Get-ChildItem selftest-*.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ -Encoding utf8; Remove-Item $_ }
          if ($a -ne 0 -or $b -ne 0) { exit 1 }

      - name: 배포 폴더 빌드와 시작 점검 (packaging/build.ps1)
        if: always()
        timeout-minutes: 12
        shell: pwsh
        run: |
          # 사용자 PC에서 쓰는 스크립트를 그대로 돌린다. 시스템 PATH의 qpdf·Poppler 없이 뜨는지 본다.
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -and $_ -notlike "*\bin\qpdf" -and $_ -notlike "*\bin\poppler" }) -join ";"
          ./packaging/build.ps1
          Get-ChildItem dist | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB)) MB" }

      - name: Windows PowerShell 5.1에서 스크립트 읽기
        if: always()
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\packaging\build.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          "PowerShell $($PSVersionTable.PSVersion): 구문 오류 없음"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuickImposing-windows
          path: dist/QuickImposing
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            out/ci-test03-1/summary.json
            out/ci-test03-2/summary.json
            out/한글 폴더
          retention-days: 14
