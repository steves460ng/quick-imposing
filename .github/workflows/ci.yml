name: ci

# Linux 1차 검사. PR과 main push에서 scripts/check.py 전체 실행을 돌린다.
# Windows 전용 동작과 배포 폴더 빌드는 windows.yml이 맡는다(그대로 유지).
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 시스템 패키지 (qpdf, Poppler, 한글 글꼴, Qt 라이브러리)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qpdf poppler-utils fonts-noto-cjk \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: 설치
        run: python -m pip install -e ".[test,gui]" ruff==0.16.9

      - name: 검사
        run: python scripts/check.py
